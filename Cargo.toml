[package]
name = "presswerk"
version = "0.5.1"
edition = "2024"
description = "Controlled releases for software built with Nix flakes"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5.53", features = ["derive"] }
git-cliff-core = { version = "2.14.2", default-features = false, features = ["repo"] }
git2 = { version = "0.21", default-features = false }
jsonc-parser = "0.34.0"
minijinja = { version = "3.0.5", features = ["serde"] }
nix-bindings-expr = "0.2.1"
nix-bindings-fetchers = "0.2.1"
nix-bindings-flake = "0.2.1"
nix-bindings-store = "0.2.1"
nix-bindings-util = "0.2.1"
regex = "1.13.1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
time = "0.3"
toml_edit = "0.23"
ureq = { version = "2.12", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

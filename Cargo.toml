[package]
name = "presswerk"
version = "0.0.0"
edition = "2024"
description = "Controlled releases for software built with Nix flakes"
publish = false

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

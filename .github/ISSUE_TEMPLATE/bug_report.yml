name: Bug report
description: Report reproducible incorrect behavior in Presswerk
title: "🐛 "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, do not open a public issue. Follow the [security policy](https://github.com/jkuball/presswerk/security/policy) instead.

  - type: input
    id: version
    attributes:
      label: Presswerk version or commit
      description: Run `presswerk --version`, or provide the commit SHA when building from source.
      placeholder: presswerk 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and Nix version.
      placeholder: x86_64-linux, Nix 2.31
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repository or sequence of commands that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials and other sensitive information before pasting logs.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no credentials or other sensitive information.
          required: true

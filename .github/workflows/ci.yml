name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact release commit to test and publish
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'presswerk-release' }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate || github.sha }}

      - name: Configure Presswerk deploy key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRESSWERK_DEPLOY_KEY: ${{ secrets.PRESSWERK_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRESSWERK_DEPLOY_KEY" > ~/.ssh/presswerk
          chmod 600 ~/.ssh/presswerk
          ssh-keyscan github.com > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/presswerk
            IdentitiesOnly yes
          EOF

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Detect Cachix push credentials
        id: cachix
        if: github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if test -n "$CACHIX_AUTH_TOKEN"; then
            echo 'push=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          authToken: ${{ steps.cachix.outputs.push == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true

      - name: Build flake
        env:
          CACHIX_PUSH: ${{ steps.cachix.outputs.push == 'true' }}
        run: |
          cache_args=()
          if test "$CACHIX_PUSH" = true; then
            cache_args=(--push-build-closure --cachix-cache jkuball)
          fi
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --flake ".#" --select 'flake: { inherit (flake) packages checks; }' \
            --no-nom --skip-cached "${cache_args[@]}"

      - name: Plan release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          plan="$RUNNER_TEMP/presswerk-plan.txt"
          status=0
          nix run .#presswerk-release -- plan > "$plan" 2>&1 || status=$?
          cat "$plan"
          {
            echo '## Release plan'
            echo
            echo '```text'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  prepare-release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Presswerk deploy key
        env:
          PRESSWERK_DEPLOY_KEY: ${{ secrets.PRESSWERK_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRESSWERK_DEPLOY_KEY" > ~/.ssh/presswerk
          chmod 600 ~/.ssh/presswerk
          ssh-keyscan github.com > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/presswerk
            IdentitiesOnly yes
          EOF

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          skipPush: true

      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; leaving release work to the newer run"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          before=$(git rev-parse HEAD)
          nix run .#presswerk-release -- prepare
          candidate=$(git rev-parse HEAD)
          if test "$candidate" = "$before"; then
            exit 0
          fi

          git push origin HEAD:main
          gh workflow run ci.yml --ref main -f candidate="$candidate"

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    needs: ci
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate }}

      - name: Configure Presswerk deploy key
        env:
          PRESSWERK_DEPLOY_KEY: ${{ secrets.PRESSWERK_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRESSWERK_DEPLOY_KEY" > ~/.ssh/presswerk
          chmod 600 ~/.ssh/presswerk
          ssh-keyscan github.com > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/presswerk
            IdentitiesOnly yes
          EOF

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          skipPush: true

      - name: Publish release
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix run .#presswerk-release -- publish HEAD

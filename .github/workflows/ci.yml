name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact release commit to test and publish
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'presswerk-release' }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build flake
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --flake ".#" --select 'flake: { inherit (flake) packages checks; }'
          --no-nom --skip-cached --push-build-closure
          ${{ secrets.CACHIX_AUTH_TOKEN != '' && '--cachix-cache jkuball' || '' }}

      - name: Plan release
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/presswerk-plan.txt"
          status=0
          nix run .#presswerk-release -- plan > "$plan" 2>&1 || status=$?
          cat "$plan"
          {
            echo '## Release plan'
            echo
            echo '```text'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Prepare release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; leaving release work to the newer run"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          before=$(git rev-parse HEAD)
          nix run .#presswerk-release -- prepare
          candidate=$(git rev-parse HEAD)
          if test "$candidate" = "$before"; then
            exit 0
          fi

          git push origin HEAD:main
          gh workflow run ci.yml --ref main -f candidate="$candidate"

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix run .#presswerk-release -- publish HEAD

  docs:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          skipPush: true

      - name: Build docs
        run: |
          nix build .#docs
          cp -rL --no-preserve=mode result "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - id: deploy
        uses: actions/deploy-pages@v4

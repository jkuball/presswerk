name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact release commit to test and publish
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'presswerk-release' }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    # Release runs publish one exact commit: the app's push of a release commit, or a
    # dispatched candidate for recovery.
    environment: ${{ (github.event_name == 'push' && github.actor == 'presswerk-releases[bot]' || github.event_name == 'workflow_dispatch' && inputs.candidate != '') && 'github-pages' || '' }}
    env:
      RELEASE: ${{ github.event_name == 'push' && github.actor == 'presswerk-releases[bot]' || github.event_name == 'workflow_dispatch' && inputs.candidate != '' }}
    steps:
      - name: Create release app token
        id: app
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build flake
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --flake ".#" --select 'flake: { inherit (flake) checks; packages = builtins.mapAttrs (_: p: removeAttrs p [ "default" ]) flake.packages; }'
          --no-nom --push-build-closure --out-link "$RUNNER_TEMP/result"
          ${{ env.RELEASE != 'true' && '--skip-cached' || '' }}
          ${{ secrets.CACHIX_AUTH_TOKEN != '' && '--cachix-cache jkuball' || '' }}

      - name: Plan release
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/presswerk-plan.txt"
          status=0
          nix run .#presswerk -- plan > "$plan" 2>&1 || status=$?
          cat "$plan"
          {
            echo '## Release plan'
            echo
            echo '```text'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Prepare release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; leaving release work to the newer run"
            exit 0
          fi

          git config user.name presswerk-releases[bot]
          git config user.email 355333992+presswerk-releases[bot]@users.noreply.github.com

          before=$(git rev-parse HEAD)
          nix run .#presswerk -- prepare
          candidate=$(git rev-parse HEAD)
          if test "$candidate" = "$before"; then
            exit 0
          fi

          # The app's push starts a push run for the release commit, which publishes it.
          git push origin HEAD:main

      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          CANDIDATE: ${{ inputs.candidate || github.sha }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git config user.name presswerk-releases[bot]
          git config user.email 355333992+presswerk-releases[bot]@users.noreply.github.com
          nix run .#presswerk -- publish HEAD

      # Keeps released binaries out of Cachix's garbage collection, so flakes
      # that run a pinned Presswerk get it from the cache instead of building it.
      # The build leaves out packages.default: it is the same derivation as
      # packages.presswerk, and nix-fast-build would link only one of the two.
      - name: Pin release in Cachix
        if: env.RELEASE == 'true'
        run: >
          cachix pin jkuball presswerk
          "$(readlink -f "$RUNNER_TEMP/result-packages.x86_64-linux.presswerk")"
          --keep-revisions 5

      - name: Collect docs
        if: env.RELEASE == 'true'
        run: |
          cp -rL --no-preserve=mode "$RUNNER_TEMP/result-packages.x86_64-linux.docs" "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v4
        if: env.RELEASE == 'true'
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy docs
        if: env.RELEASE == 'true'
        uses: actions/deploy-pages@v4

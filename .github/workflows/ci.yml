name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact release commit to test and publish
        required: false
        type: string

permissions:
  actions: write
  contents: read
  id-token: write
  pages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'presswerk-release' }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate != '' && 'github-pages' || '' }}
    steps:
      - name: Create release app token
        id: app
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jkuball
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build flake
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --flake ".#" --select 'flake: { inherit (flake) packages checks; }'
          --no-nom --push-build-closure --out-link "$RUNNER_TEMP/result"
          ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate != '') && '--skip-cached' || '' }}
          ${{ secrets.CACHIX_AUTH_TOKEN != '' && '--cachix-cache jkuball' || '' }}

      - name: Plan release
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/presswerk-plan.txt"
          status=0
          nix run .#presswerk -- plan > "$plan" 2>&1 || status=$?
          cat "$plan"
          {
            echo '## Release plan'
            echo
            echo '```text'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Prepare release
        if: github.event_name == 'push' && github.actor != 'presswerk-releases[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; leaving release work to the newer run"
            exit 0
          fi

          git config user.name presswerk-releases[bot]
          git config user.email 355333992+presswerk-releases[bot]@users.noreply.github.com

          before=$(git rev-parse HEAD)
          nix run .#presswerk -- prepare
          candidate=$(git rev-parse HEAD)
          if test "$candidate" = "$before"; then
            exit 0
          fi

          git push origin HEAD:main
          gh workflow run ci.yml --ref main -f candidate="$candidate"

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git config user.name presswerk-releases[bot]
          git config user.email 355333992+presswerk-releases[bot]@users.noreply.github.com
          nix run .#presswerk -- publish HEAD

      - name: Collect docs
        if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
        run: |
          cp -rL --no-preserve=mode "$RUNNER_TEMP/result-packages.x86_64-linux.docs" "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy docs
        if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
        uses: actions/deploy-pages@v4
